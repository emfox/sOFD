name: Release

# Publishing is triggered by pushing a tag, so the artefacts and the tag can
# never disagree about what was built.
#
# The tag names the release, and a release tag is a plain version: `v0.6.0` is
# the release that ships whatever the crates inside state. The workspace's 21
# crates no longer agree on a version, so the tag names the products rather than
# any one crate — but it still spells that as a version, because `VERSION` below
# is read off it and every download is named for it. `docs/Versioning.md` 5.1
# states the rule and why the alternative, a letter in the tag, was withdrawn.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One desktop build per system. Windows is cross-compiled from Ubuntu with
  # mingw-w64, the same way it is built and tested locally, so the toolchain
  # comes from apt rather than a Chocolatey install on a Windows runner.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            target: ""
            compile: ""
          - os: ubuntu-latest
            name: windows
            # The GNU target, not MSVC: the result runs without a matching
            # Visual C++ redistributable on the machine that downloads it.
            target: x86_64-pc-windows-gnu
            compile: mingw
          - os: macos-latest
            name: macos
            target: ""
            compile: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The step that packs this system's reader is Python, and a Windows
      # runner has no interpreter on `PATH` until one is asked for.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # font-kit needs fontconfig headers to build its sys crate. The Windows
      # build compiles on Linux too, so it takes the same Linux headers.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config
          if [ "${{ matrix.compile }}" = mingw ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64
          fi
      - name: Install system dependencies
        if: runner.os == 'macOS'
        run: brew install fontconfig pkg-config

      # Dependencies only, not the whole `target/`: caching every artefact made
      # a multi-gigabyte blob whose restore cost more than the build it saved.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-reader-${{ matrix.name }}

      # The cross build names the linker the `*-windows-gnu` target cannot find
      # on its own; a native build only states the target it already is.
      - name: Build the reader
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p sofd-reader --target "${{ matrix.target }}"
          else
            cargo build --release -p sofd-reader
          fi

      - name: Collect the executable
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            linux)   cp target/release/sofd-reader dist/sofd-reader-linux ;;
            windows) cp target/x86_64-pc-windows-gnu/release/sofd-reader.exe dist/sofd-reader-windows.exe ;;
            macos)   cp target/release/sofd-reader dist/sofd-reader-macos ;;
          esac
          ls -la dist

      # Each system's reader ships on its own: a download of twenty megabytes
      # should not carry two other systems' binaries with it.
      - name: Package the reader
        shell: bash
        run: |
          # The tag is the version; see the note at the top.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_package.py reader \
            --version "$VERSION" --out dist --dist dist \
            --system "${{ matrix.name }}"

      # One archive per system and no others: what `release_package.py`
      # writes is `dist/sofd-<version>-<system>` plus an extension, and the
      # extension is the system's own — `.zip` for Windows and macOS, `.tar.gz`
      # for Linux. Naming only `.tar.gz` here is how a Windows reader would go
      # missing from the release without the job failing.
      - name: Hand the reader to the packing job
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.name }}
          path: |
            dist/sofd-*-linux.tar.gz
            dist/sofd-*-windows.zip
            dist/sofd-*-macos.zip
          if-no-files-found: error

  # The same reader, built for the browser. It is a separate job because its
  # output is a page rather than an executable: `wasm-bindgen` writes the module
  # and the glue, and `web/` supplies the canvas they draw into.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-web

      # Pinned to the release the last one shipped from, so a page that built
      # yesterday builds the same way today.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # `--no-opt` because wasm-opt means fetching binaryen from GitHub, and a
      # release that fails when that download does is a release that is not
      # reproducible. The size it saves is not worth an unavailable artefact.
      - name: Build the reader for the browser
        run: |
          wasm-pack build crates/sofd-reader --target web --release --no-opt \
            --out-dir pkg

      # The page and the module it loads ship together: one without the other
      # runs nothing.
      - name: Package the page
        run: |
          # The tag is the version; see the note at the top.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_package.py web \
            --version "$VERSION" --out dist \
            --page crates/sofd-reader/web --pkg crates/sofd-reader/pkg

      - name: Hand the page to the packing job
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/sofd-*.zip
          if-no-files-found: error

  # Android needs a native library the activity can load, and an archive the
  # system can install. The SDK and NDK are fetched here; the archive is put
  # together by a script, so no Gradle project is committed for three files.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android

      - name: Install the Android SDK tools
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # The NDK is the compiler and linker this target needs; the platform
          # is the android.jar the activity is compiled against.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build the native library
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # A cdylib rather than the binary: the activity loads the symbol
          # table through System.loadLibrary, and only a library exports one.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang" \
            cargo build --release --lib -p sofd-reader --target aarch64-linux-android

      - name: Assemble the package
        run: |
          python3 scripts/android_package.py \
            --sdk "$ANDROID_HOME" \
            --lib target/aarch64-linux-android/release/libsofd_reader.so \
            --out dist

      - name: Name the package for the release
        run: |
          # The tag is the version; see the note at the top.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_package.py android \
            --version "$VERSION" --out dist \
            --apk dist/sofd-reader-android.apk
          rm dist/sofd-reader-android.apk

      - name: Hand the package to the packing job
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/sofd-*.apk
          if-no-files-found: error

  # The reader as a Flatpak: the one Linux download that does not depend on
  # which distribution the user runs. It builds its own copy of the reader
  # rather than taking the desktop job's artefact, because a build machine's
  # glibc is not the runtime's: the app has to link against what the freedesktop
  # SDK provides, which is what inside the sandbox will actually be there.
  #
  # Not in the `desktop` matrix: that job produces a bare executable per system,
  # and this produces a sandboxed app, which is a different kind of artefact.
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config flatpak flatpak-builder

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-flatpak

      - name: Install the runtime the manifest names
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build the reader
        run: cargo build --release -p sofd-reader

      - name: Build the app and bundle it
        run: |
          # The tag is the version; see the note at the top.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/flatpak_package.py build \
            --version "$VERSION" --binary target/release/sofd-reader --out dist

      # Installed rather than inspected: a bundle that imports and whose
      # executable is where the manifest said is the part a build log cannot
      # show. What runs inside is then held to the document: the `sofd` binary
      # in the same sandbox opens the fixture, converts it, and the page is
      # counted ink pixel by ink pixel. A reader that opens its window onto a
      # blank page has shipped before, and this is the check that sees it.
      - name: Prove the app in the sandbox
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/flatpak_package.py verify --bundle "dist/sofd-$VERSION.flatpak"
          # `sofd-cli` is built on the same host but run by the runtime, so this
          # also proves the binary finds the runtime's fontconfig and freetype
          # rather than the runner's. The fixture embeds no font, so the page
          # is drawn — or not — with whatever face the runtime offers.
          cargo build --release -p sofd-cli
          mkdir -p dist/proof
          flatpak build --filesystem="$PWD:ro" --die-with-parent \
            dist/sofd-build \
            sh -c "
              test -x /app/bin/sofd-reader
              target/release/sofd convert tests/fixtures/ofdrw/helloworld.ofd \
                --format png --output dist/proof
            "
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          # Measured on this fixture: 704 ink pixels with a CJK face available
          # and 0 without one. 200 sits far from both.
          pages = sorted(Path("dist/proof").glob("*.png"))
          if not pages:
              sys.exit("error: the conversion wrote no page")
          image = Image.open(pages[0]).convert("L")
          ink = sum(1 for pixel in image.tobytes() if pixel < 0xF0)
          print(f"{ink} ink pixels in {image.width}x{image.height}")
          sys.exit(0 if ink > 200 else "error: the page was drawn without text")
          PY

      - name: Hand the app to the packing job
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/sofd-*.flatpak
          if-no-files-found: error

  # The libraries other programs link against, and the browser bindings of the
  # engine itself. These are the same on every desktop system, so one build.
  artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      # Dependencies only, for the same reason the desktop job above states.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-artefacts

      - name: Build the C ABI library
        run: cargo build --release -p sofd-ffi

      # The header is generated by cbindgen into the crate, so a release that
      # shipped an out-of-date header would be caught here.
      - name: Check the generated C header is current
        run: git diff --exit-code crates/sofd-ffi/include/sofd.h

      # A library ships with the header a caller compiles against, under the
      # two names a linker is given: one archive, not three files.
      - name: Package the library
        run: |
          # The tag is the version; see the note at the top.
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/lib
          cp target/release/libsofd_ffi.so target/release/libsofd_ffi.a \
            crates/sofd-ffi/include/sofd.h dist/lib/
          python3 scripts/release_package.py ffi \
            --version "$VERSION" --out dist --lib dist/lib

      - name: Hand the product to the packing job
        uses: actions/upload-artifact@v4
        with:
          name: ffi
          path: dist/sofd-*.tar.gz
          if-no-files-found: error

  # UOS Desktop V20 ships glibc 2.28 and nothing newer, so a reader built on a
  # current runner installs and then refuses to start. The build therefore
  # happens inside Debian 10, whose glibc is that same 2.28, and the package is
  # proven by installing it into a Deepin 20 container, the desktop UOS is
  # built from.
  uos:
    runs-on: ubuntu-latest
    container:
      image: debian:buster
    steps:
      - uses: actions/checkout@v4

      # Debian 10 is EOL and its packages moved to the archive, so the ordinary
      # mirrors no longer answer and apt needs to be told not to date-check.
      - name: Point apt at the archive
        run: |
          rm -f /etc/apt/sources.list.d/*.list
          printf 'deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n' > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Check-Date=false update -qq
          # python3 is not in a Debian 10 base image, and the step that turns
          # the build into a `.deb` is written in it.
          apt-get install -y -qq --no-install-recommends \
            curl ca-certificates build-essential pkg-config git python3 \
            libfontconfig1-dev libfreetype6-dev

      - name: Install toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-uos

      - name: Build the reader
        run: cargo build --release -p sofd-reader

      # The package is the only thing published, and it must be one a glibc
      # 2.28 system can run; the check fails here rather than at the user.
      - name: Assemble the package
        run: |
          # The tag is the version; see the note at the top.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/uos_package.py \
            --binary target/release/sofd-reader \
            --version "$VERSION" \
            --out dist \
            --check-glibc

      # The archive is named for the architecture it was built for, so it is
      # matched by pattern rather than by a name this file would have to keep.
      - name: Name the package for the release
        run: |
          # The tag is the version; see the note at the top.
          VERSION="${GITHUB_REF_NAME#v}"
          deb=$(ls dist/sofd-reader-uos-*.deb)
          python3 scripts/release_package.py uos \
            --version "$VERSION" --out dist --deb "$deb"
          rm "$deb"

      - name: Hand the package to the packing job
        uses: actions/upload-artifact@v4
        with:
          name: uos
          path: dist/sofd-*.deb
          if-no-files-found: error

  # The server is the form a deployment runs, and it needs no display: the
  # desktop reader is built above and is not here.
  #
  # The image is built by `docker build` rather than a publishing action,
  # because nothing is pushed to a registry: what ships is the tar `docker save`
  # writes, which `docker load` on the receiving machine takes. That also means
  # this job can prove the image serves before it is attached, which a push
  # straight from a build cannot.
  server:
    runs-on: ubuntu-latest
    # The image is published to the GitHub container registry rather than
    # attached to the release, so this job's token needs to write packages. It
    # is declared here and not at the top: every other job would inherit it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      # The binary links fontconfig, so the headers are needed to build and the
      # fonts are needed by the image that runs it. Pillow reads the page back
      # so the proof below can count what was drawn.
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
          python3 -m pip install --quiet Pillow

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-server

      - name: Build the server
        run: cargo build --release -p sofd-server

      - name: Log in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The Dockerfile copies the binary in rather than building it, so it is
      # placed where the file expects it and nothing else is.
      #
      # A registry rejects an upper-case path and this repository's name has two
      # capitals in it, so the name is folded before it is used. The version and
      # `latest` are both tagged: a download names a version, and a deployment
      # that does not care which one it gets names neither.
      - name: Build the image
        run: |
          image="$(echo "ghcr.io/${{ github.repository_owner }}/sofd-server" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          cp target/release/sofd-server ./sofd-server
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          rm ./sofd-server

      # A container that starts is not a container that serves. The binary's own
      # health check asks the running instance for `/healthz`, and a document is
      # then opened and drawn, because a missing font is not a missing process.
      # It runs before the push, so an image that fails this is never published.
      - name: Prove the image serves
        run: |
          docker run -d --name proof -p 127.0.0.1:8080:8080 "$IMAGE:latest"
          for _ in $(seq 1 30); do
            docker exec proof sofd-server --health-check && break
            sleep 1
          done
          docker exec proof sofd-server --health-check

          # `helloworld.ofd` embeds no font, so the page it draws has to come
          # from the image's own. An image without one answers `/healthz` and
          # returns a page that is blank: measured, the same document gives
          # 704 ink pixels with the font and 0 without, so the count is the
          # only thing that tells the two apart.
          id=$(curl -sS -X POST --data-binary @tests/fixtures/ofdrw/helloworld.ofd \
                 -H 'Content-Type: application/ofd' \
                 http://127.0.0.1:8080/api/v1/documents | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sSf -o /tmp/page.png "http://127.0.0.1:8080/api/v1/documents/$id/pages/0/png"
          python3 -c '
          import sys
          from PIL import Image
          pixels = Image.open("/tmp/page.png").convert("RGBA").tobytes()
          ink = sum(1 for i in range(0, len(pixels), 4)
                    if pixels[i + 3] and pixels[i:i + 3] != b"\xff\xff\xff")
          print(f"the drawn page holds {ink} ink pixels")
          sys.exit(0 if ink > 200 else "the page was drawn without text")
          '
          docker rm -f proof

      # Not attached to the release: a compressed copy of an image that the
      # registry already serves by digest is a second answer to what was
      # published, and the tag is the one a deployment pulls by.
      - name: Push the image
        run: docker push --all-tags "$IMAGE"

  # Every job above builds, this one publishes. It exists because a release
  # asset is replaced rather than merged by an upload of the same name, so the
  # parts cannot be attached as they are built: the checksum manifest has to be
  # written after the last of them lands, and a file that a downloader cannot
  # check is not worth shipping.
  #
  # It also means the page carries products rather than parts: a reader per
  # desktop system, a browser build, an Android app, a UOS package and a C ABI
  # library, each named for the release it came from and the thing it runs on.
  # Every one of them is assembled by the job that builds it, so the error that
  # names a missing file lands in the job that was meant to produce it.
  pack:
    needs: [desktop, web, android, flatpak, uos, artefacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather what the builds produced
        uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true

      - name: Make the output directory
        run: mkdir -p dist

      - name: Collect the products
        run: |
          cp parts/sofd-*.tar.gz parts/sofd-*.zip parts/sofd-*.apk parts/sofd-*.deb parts/sofd-*.flatpak dist/
          ls -la dist

      - name: Read the release notes from the changelog
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md

      # No signing key ships with this project, so the manifest is the only
      # thing a download can be held to.
      - name: Checksum the products
        run: python3 scripts/release_checksums.py generate dist --sums SHA256SUMS

      # A re-run attaches over the previous attempt, so the check is against
      # the files this run made rather than against whatever was there.
      - name: Check the manifest against the products
        run: python3 scripts/release_checksums.py verify dist

      # A product renamed between attempts leaves its old file behind, and a
      # release whose attachment list does not match the build is worse than one
      # missing a file. The action overwrites same-named assets but never
      # removes the rest, so the rest goes first.
      - name: Clear the previous attempt's attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
            done || true

      - name: Attach the products to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sofd-*
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true

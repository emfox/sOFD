name: CI

on:
  push:
    branches: [main]
    # A docs-only or licence-only commit has nothing for the Rust gate to say,
    # and the gate is the expensive part of a push. An empty commit changes no
    # path either, so it does not start a run.
    paths-ignore: &ignored-paths
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore: *ignored-paths

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Section 3 of docs/Conventions.md, enforced where nobody can skip it. A hook
  # catches a bad message before the commit exists, but a hook is local: it is
  # bypassed by --no-verify, absent from a clone that never ran
  # scripts/install-hooks.sh, and never runs for a commit made in the web
  # editor. This job reads the whole reachable history rather than a range,
  # which is a superset of what a push or a pull request proposes and catches a
  # commit that is already on main. It needs no toolchain, so it costs seconds.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history is the thing under test; a shallow clone would look at
          # the tip and nothing else.
          fetch-depth: 0

      - name: Commit messages
        run: python3 scripts/check_commits.py --grandfathered scripts/commit-baseline.txt

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `stable`: a rolling toolchain turns every new lint
      # upstream ships into a red build nobody asked for. Raising the version
      # here is a deliberate commit.
      #
      # This is the toolchain the project is built with, not the minimum it
      # supports: `rust-version` in the workspace manifest states that, and the
      # two are independent. A new feature usable at a lower version does not
      # raise either, so the pinned number moving here means a lint baseline
      # moved, nothing about what a consumer needs.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      # font-kit needs fontconfig headers to build its sys crate. The `tauri`
      # shell links the platform's webview, which on Linux is WebKitGTK, and
      # the workspace build below compiles it along with everything else.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev build-essential

      # `rust-version` in the workspace manifest is a claim until something
      # builds under it. The version is read from the manifest rather than
      # written here, so the one place that states the minimum is also the one
      # place that would have to change.
      - name: Install the minimum toolchain
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal

      # `Swatinem/rust-cache` caches the registry and the *dependency* artefacts
      # rather than the whole `target/`. Caching all of `target/` made a single
      # 7.8 GB blob that every job restored in ~140 s — longer than the build it
      # replaced. This key is also per-job, so the six jobs stop contending for
      # one entry.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: Format
        run: cargo fmt --all --check

      # Every check below runs on the pinned toolchain; this one runs on the
      # minimum, which is the only way the manifest's claim is ever tested.
      - name: Build on the minimum supported Rust
        run: cargo +"$MSRV" check --workspace --all-targets

      # `-D warnings` is passed to clippy rather than through RUSTFLAGS, which
      # would apply to every dependency too and let someone else's crate fail
      # this build. Only this workspace's code is held to the standard.
      - name: Clippy
        env:
          RUSTFLAGS: ""
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=$?
          # Surface each finding as an annotation, so it is readable on the
          # commit rather than only in a log nobody opens. A clean run leaves
          # grep with nothing to match, which must not fail the step.
          grep -E ': (warning|error)' clippy.log | head -20 \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          exit $status

      # One build, then the test steps reuse it. `cargo test` would otherwise
      # recompile the same crates for each flag set it is invoked with.
      - name: Build every target and feature
        run: cargo build --workspace --all-targets --all-features

      # The six worked examples are the starting point a third party copies,
      # so an example that stops compiling is a broken front door. They are
      # named rather than left to `--all-targets`, because the browser one only
      # exists on wasm32 and the host build proves nothing about it.
      - name: Worked examples
        run: |
          cargo build --workspace --examples
          rustup target add wasm32-unknown-unknown
          cargo build -p sofd-wasm --example browser --target wasm32-unknown-unknown

      # Compiling proves an example typechecks and nothing else. The five that
      # need no browser are run against a document this step writes, and what
      # landed on disk is checked: a PNG per page, a PDF that ends, a frame that
      # reports the page count, a service that converts, a page walked as
      # geometry. The browser example stays build-only above, because running it
      # needs a browser and a page.
      - name: Run the worked examples
        run: python3 scripts/run_examples.py

      # The Android build is checked here rather than only on a release tag: a
      # feature its device lacks compiles to a library that loads and exits, so
      # the gate runs on every push. Device tests cannot, without an emulator.
      - name: Android target
        run: |
          rustup target add aarch64-linux-android
          cargo clippy -p sofd-egui --target aarch64-linux-android \
            --message-format=short -- -D warnings

      # The layout of a real invoice is pinned against the producer's own
      # offsets, and that sample is fetched rather than committed. Without it
      # the tests that read it skip, which passes while proving nothing.
      - name: Fetch the samples the tests read
        run: python3 scripts/sample_fetch.py ofdrw

      - name: Test
        run: cargo test --workspace

      - name: Test with every feature on
        run: cargo test --workspace --all-features

      # The pixels, not the ops: `cargo test` runs this too, but naming it here
      # keeps a rendering regression readable on the run page rather than buried
      # in the suite. A reference that needs updating is a deliberate commit.
      - name: Golden images
        run: cargo test -p sofd --test golden

      # The reader's window is a real widget tree, so this drives it without a
      # display and without an X server: labels come from the catalogue and
      # clicks reach `App`. Without this step the layout could rot while the
      # engine keeps passing.
      - name: Reader window, driven headlessly
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          cargo test -p sofd-egui --test window

      - name: Message catalogues
        run: python3 scripts/check_i18n.py --strict

      - name: Language policy
        run: python3 scripts/check_language.py

      # A crate that never says whether it reaches a registry is one nobody
      # decided about, and the answer changes what `cargo publish` would do.
      - name: Registry surface
        run: python3 scripts/check_publish.py

      # What a crate ships is its own directory, not the repository. A file an
      # `include_str!` climbs out to therefore compiles here and goes missing in
      # the tarball, which is a release that fails after the tag is pushed.
      - name: Published tarballs hold what the crates include
        run: python3 scripts/check_packaging.py

      - name: Release checksums round-trip
        run: python3 scripts/release_checksums.py selftest

      # The Android archive is assembled by a script; its layout is checked
      # here so a change to it fails on a push rather than on a release tag.
      - name: Android package layout
        run: python3 scripts/android_package.py selftest

      - name: GB/T 33190 conformance register
        run: python3 scripts/check_compliance.py --check-only

      - name: Compliance matrix is current
        run: |
          python3 scripts/check_compliance.py
          git diff --exit-code docs/Compliance.md

      - name: Committed fixture archives match their sources
        run: python3 scripts/pack_fixtures.py --check

      - name: Fixtures validate against annex A schemas
        run: |
          python3 -m pip install --quiet lxml
          python3 scripts/validate_ofd.py --allow-foreign \
            $(find compliance/fixtures -name '*.ofd' -o -name '*.xml' | sort)

  # The second-implementation samples are fetched, not committed, so CI cannot
  # assume they are there. This runs the same job locally does, which is the point:
  # the parse bugs it found were all hard errors that no committed fixture hit.
  third-party-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: samples

      - name: Fetch the samples
        run: python3 scripts/sample_fetch.py ofdrw

      - name: Every pinned sample is present
        run: python3 scripts/sample_fetch.py ofdrw --check

      # Not every sample opens: the two that do not are recorded with a cause
      # in the script. What CI holds is the set, so a sample that breaks for a
      # new reason fails here and one that starts working says so.
      - name: The samples that do not open are still the known ones
        run: python3 scripts/sample_fetch.py ofdrw --parse

      # The standard's own conformance set, one document per clause. It shares
      # this job because it is fetched the same way and needs the same build.
      - name: Fetch the clause samples
        run: python3 scripts/sample_fetch.py gbt33190-samples

      - name: Every clause sample is present
        run: python3 scripts/sample_fetch.py gbt33190-samples --check

      - name: Every clause sample still opens
        run: python3 scripts/sample_fetch.py gbt33190-samples --parse

  # The budget in docs/Performance.md, enforced. It runs the benchmarks and
  # checks each one-page figure against its ceiling, which is set well above
  # the baseline: only a change that makes a page cost several times what it
  # did crosses it. Ordinary noise and different hardware do not.
  #
  # It does not run for a docs-only or config-only commit: the workflow's
  # `paths-ignore` already drops those before any job is created, and a commit
  # that touches Rust and docs together still runs it, because the Rust half
  # could move a benchmark.
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf

      # Only the budgeted targets: running every benchmark would spend a
      # runner's afternoon on numbers nothing gates on. The memory run keeps
      # its reading in a file beside criterion's, which the gate reads back.
      - name: Run the budgeted benchmarks
        run: |
          cargo bench -p sofd-parser --bench parse
          cargo bench -p sofd --bench memory
          cargo bench -p sofd-convert --bench convert

      - name: Every benchmarked stage is within budget
        run: python3 scripts/check_performance.py

  fuzz:
    runs-on: ubuntu-latest
    # A short, deterministic smoke run: enough to catch a crash on the seeds
    # and a handful of mutations without spending a runner's afternoon. The
    # real campaign runs locally with `cargo +nightly fuzz run <target>`.
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      # The font target builds sofd-font, whose font-kit dependency needs
      # the fontconfig headers even though nothing is drawn.
      - name: Install fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sofd-fuzz/fuzz
          shared-key: fuzz

      # Kept as `cargo install` rather than moved to the install action: it is
      # not in that action's managed list, so it would fall back to
      # cargo-binstall, and the source build is only about ten seconds here.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # cargo-fuzz looks for its crate from where it is run, and the crate sits
      # one directory below the workspace member that wraps it, hence the
      # working-directory on every run below.
      - name: Fuzz the ZIP reader
        working-directory: crates/sofd-fuzz/fuzz
        run: cargo +nightly fuzz run package_open -- -runs=20000 -max_len=4096

      - name: Fuzz the XML cursor
        working-directory: crates/sofd-fuzz/fuzz
        run: cargo +nightly fuzz run xml_cursor -- -runs=20000 -max_len=4096

      # The three below take bytes the document supplies rather than bytes a
      # caller passes, which is the difference that makes them worth running.
      - name: Fuzz the TrueType reader
        working-directory: crates/sofd-fuzz/fuzz
        run: cargo +nightly fuzz run ttf_face -- -runs=20000 -max_len=65536

      - name: Fuzz the certificate reader
        working-directory: crates/sofd-fuzz/fuzz
        run: cargo +nightly fuzz run certificate -- -runs=20000 -max_len=4096

      - name: Fuzz the PDF writer
        working-directory: crates/sofd-fuzz/fuzz
        run: cargo +nightly fuzz run pdf_write -- -runs=20000 -max_len=64

  audit:
    runs-on: ubuntu-latest
    # A dependency with a published advisory is a defect this project ships,
    # so the build stops on one. The job runs on the lock file rather than the
    # source, so it also catches a transitive crate nobody here named.
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check advisories, licences, bans and sources
        run: cargo deny --all-features check

  semver:
    runs-on: ubuntu-latest
    # A break against a version somebody can already depend on should fail here
    # rather than surprise them. The baseline is a published release, so the job
    # is a no-op against a tree that no registry has served yet. Each crate is
    # held to the release before the one it is shipping at — its own version,
    # not any sibling's: `docs/Versioning.md` has them move separately, and a
    # version of `sofd-cli` says nothing about `sofd-error`.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      # cargo-doc builds every crate's rustdoc, and font-kit's sys crate needs
      # the fontconfig headers whatever the target is.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      # The registry, not the tag list, decides the baseline. A tag is a tree
      # this project built; a version in a manifest is one a caller can put in
      # their own, and only the second is something a break can hurt.
      #
      # The tag a crate is compared against has to be one that carried this
      # crate's current version, so the question asked of each crate is "is the
      # version this tree declares published for me". A crate whose version is
      # not on the registry is skipped: nothing can depend on it, so there is
      # nothing to break.
      - name: Find the published version of each crate
        id: baseline
        run: |
          set -o pipefail
          cargo metadata --format-version 1 --no-deps > metadata.json
          python3 - <<'PY' > baseline.txt
          import json

          with open("metadata.json", encoding="utf-8") as handle:
              data = json.load(handle)
          for package in sorted(data["packages"], key=lambda p: p["name"]):
              publish = package.get("publish")
              if publish is not None and publish == []:
                  continue
              print(f"{package['name']} {package['version']}")
          PY
          if [ ! -s baseline.txt ]; then
            echo "No published crate found in the workspace." >&2
            exit 1
          fi
          echo "Crates this tree would publish:"
          cat baseline.txt

      - name: Ask the registry which versions it serves
        id: served
        run: |
          set -o pipefail
          : > served.txt
          while read -r crate version; do
            url="https://crates.io/api/v1/crates/$crate/$version"
            code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: sofd-ci (https://github.com/emfox/sOFD)' "$url")
            case "$code" in
              200) echo "$crate $version published" | tee -a served.txt ;;
              404) echo "$crate $version unpublished" | tee -a served.txt ;;
              *)
                echo "crates.io answered HTTP $code for $url" >&2
                exit 1
                ;;
            esac
          done < baseline.txt
          if grep -q published served.txt; then
            echo "compare=yes" >> "$GITHUB_OUTPUT"
          else
            echo "compare=no" >> "$GITHUB_OUTPUT"
            echo "Nothing this tree declares is on the registry, so no break can reach a caller."
          fi

      - name: Install cargo-semver-checks
        if: steps.served.outputs.compare == 'yes'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # Two comparisons, because either one alone leaves a gap.
      #
      # Against the release: a crate whose declared version is on the registry
      # is held to the release its callers are on, so `0.6.1` must not break
      # `0.6.0`. Which ref that is comes from `semver_baseline.py`, because a
      # release can ship a subset of the workspace and then no tag names the
      # version the crate now states.
      #
      # Against the parent commit, which is what sees a break merged into a
      # version nobody has published yet. A version on a registry cannot be
      # replaced, so a break merged without a version bump spends the next
      # version on a fix. Comparing neighbours is what sees the bump a commit
      # intends: against the parent a `0.6.0` to `0.7.0` bump is a minor
      # release and a break is allowed in it.
      #
      # That is the whole of the rule: a break is a failure when it would land
      # on a published version, and is free when the line it lands on is still
      # being written. `docs/Conventions.md` §6 states it; this job is the
      # enforcement.
      #
      # cargo-semver-checks skips a crate that states `publish = false`, so the
      # published set in each manifest is what this gate covers: the shells,
      # the testkit and i18n never reach a consumer and are skipped. A crate
      # whose version is not yet on the registry is skipped by the flag below
      # rather than by the tool, since only the registry knows.
      - name: Check the public API against the published release
        if: steps.served.outputs.compare == 'yes'
        run: |
          # A crate that is not published yet has no release to break, so it is
          # left out of the baseline comparison rather than failing on a tag
          # that never carried it.
          #
          # The ref is not `v<version>` outright: a release can ship a subset of
          # the workspace at a patch version, and then no tag names that
          # version. `semver_baseline.py` picks the newest tag below it that
          # carried the crate, which is the release its callers are on.
          #
          # Crates are grouped by the ref they are held to, and each group is
          # checked in one run. The tool clones and builds the baseline once,
          # so seventeen crates held to `v0.5.1` cost one build of it rather
          # than seventeen. `--package` repeats, so the group travels as flags.
          python3 scripts/semver_baseline.py --groups served.txt > groups.txt
          while read -r ref crates; do
            flags=()
            for spec in $crates; do
              flags+=(--package "${spec%@*}")
            done
            set -- "${flags[@]}"
            echo "== $(( $# / 2 )) package(s) against $ref =="
            cargo semver-checks check-release --baseline-rev "$ref" "${flags[@]}"
          done < groups.txt

      # `HEAD^1` is spelled rather than `HEAD^` for clarity, not correctness:
      # both name the first parent, and a repository with one commit has
      # neither, so neither spelling can pass by comparing a tree with itself.
      - name: Check the public API against the parent commit
        if: steps.served.outputs.compare == 'yes'
        run: cargo semver-checks check-release --baseline-rev HEAD^1

  coverage:
    runs-on: ubuntu-latest
    # A gate, with the floor set well under the measured baseline (87.56% lines)
    # so ordinary work never trips it while losing a module's tests does.
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain with the coverage runtime
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview

      # font-kit needs fontconfig headers to build its sys crate. The workspace
      # build this job measures includes the `tauri` shell, which links the
      # platform's webview: without WebKitGTK the run dies in a dependency's
      # build script rather than in anything the coverage would have described.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The layout tests read a fetched sample and fail without it, so this job
      # fetches it too: a coverage run that skipped them would report lines the
      # suite never reached as though nothing had gone wrong.
      - name: Fetch the samples the tests read
        run: python3 scripts/sample_fetch.py ofdrw

      - name: Measure line coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Summarize into the run page
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail below the floor
        run: cargo llvm-cov report --fail-under-lines 85

      - name: Keep the report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

[package]
name = "sofd-wasm"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Ships as an application, not as a dependency.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sofd = { path = "../sofd", version = "0.8", features = ["render", "sign", "convert", "search"] }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-bindings = { path = "../sofd-bindings", version = "0.1" }
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

# `wasm-opt` is not run: the binaryen release it downloads rejects the
# reference types `wasm-bindgen` now emits, and the build fails on input it
# could not have produced. The Rust release profile is what sizes this out.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
sofd-testkit = { path = "../sofd-testkit" }

[package]
name = "sofd-render"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rasterise a display list to pixels"
keywords = ["ofd", "raster", "render", "anti-aliasing", "tiny-skia"]
categories = ["rendering", "multimedia::images"]

[dependencies]
sofd-common = { path = "../sofd-common", version = "0.6" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-display = { path = "../sofd-display", version = "0.8" }
sofd-io = { path = "../sofd-io", version = "0.5" }
tiny-skia.workspace = true
image.workspace = true
tracing.workspace = true

# No `backend-raster` feature: the raster backend is the one that exists, so
# naming it was a promise of a choice the crate does not offer. A command-stream
# backend for browsers lands as its own feature when it lands, not before.

[package.metadata.cargo-semver-checks.lints]
workspace = true

[package]
name = "sofd-print"
version = "0.5.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Turn a display list into a print job, from the same list the screen draws"
keywords = ["ofd", "print", "raster", "output"]
categories = ["multimedia::images"]

# Printing consumes the same display list as screen rendering,
# which is what keeps output faithful to the preview.
[dependencies]
sofd-common = { path = "../sofd-common", version = "0.5" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-display = { path = "../sofd-display", version = "0.5" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
sofd-render = { path = "../sofd-render", version = "0.6" }
sofd-font = { path = "../sofd-font", version = "0.5" }
tracing.workspace = true

[package.metadata.cargo-semver-checks.lints]
workspace = true

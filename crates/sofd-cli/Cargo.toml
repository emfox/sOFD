[package]
name = "sofd-cli"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "The `sofd` command: inspect, render, convert, verify, search, audit and print an OFD document"
keywords = ["ofd", "document", "cli", "render", "convert"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "sofd"
path = "src/main.rs"

[dependencies]
# The bin runs every capability, so it turns them all on: `edit` is named
# though no subcommand edits yet, because a facade feature left off is a
# capability the command cannot grow into without a manifest change.
sofd = { path = "../sofd", version = "0.5", features = ["render", "print", "sign", "convert", "pdf", "edit", "search", "archive", "async"] }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-i18n = { path = "../sofd-i18n", version = "0.5" }
sofd-io = { path = "../sofd-io", version = "0.5" }
# Named directly because a `[features]` entry cannot turn on a passthrough
# dependency, and the bin reaches `sofd-archive` and `sofd-print` for their
# types. Being named here is also what makes them publishable.
sofd-archive = { path = "../sofd-archive", version = "0.5" }
sofd-print = { path = "../sofd-print", version = "0.5" }
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json.workspace = true

[dev-dependencies]
sofd-package = { path = "../sofd-package", version = "0.5" }

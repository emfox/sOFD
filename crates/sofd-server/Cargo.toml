[package]
name = "sofd-server"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Ships as an application, not as a dependency.
publish = false

[lib]
name = "sofd_server"
path = "src/lib.rs"

[[bin]]
name = "sofd-server"
path = "src/main.rs"

[dependencies]
sofd = { path = "../sofd", version = "0.9", features = ["render", "sign", "convert", "search", "pdf"] }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
axum.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "timeout"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sofd-testkit = { path = "../sofd-testkit" }

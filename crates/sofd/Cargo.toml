[package]
name = "sofd"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Open and use an OFD document: render, convert, print, sign, edit, search and audit behind one facade"
keywords = ["ofd", "document", "render", "convert", "digital-signature"]
categories = ["parser-implementations", "multimedia::images"]

# Facade crate: the only public surface, so internals can be refactored freely.
[dependencies]
sofd-common = { path = "../sofd-common", version = "0.6" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-io = { path = "../sofd-io", version = "0.5" }
sofd-model = { path = "../sofd-model", version = "0.6" }
sofd-package = { path = "../sofd-package", version = "0.6" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-display = { path = "../sofd-display", version = "0.7" }
sofd-parser = { path = "../sofd-parser", version = "0.5" }
sofd-render = { path = "../sofd-render", version = "0.7", optional = true }
sofd-crypto = { path = "../sofd-crypto", version = "0.7", optional = true }
sofd-sign = { path = "../sofd-sign", version = "0.7", optional = true }
# `default-features = false` because the facade turns PDF on through
# `sofd-convert/pdf`, not through this crate's defaults; a default here would
# bring a second path to the same dependency.
sofd-convert = { path = "../sofd-convert", version = "0.9", optional = true, default-features = false }
sofd-edit = { path = "../sofd-edit", version = "0.5", optional = true }
sofd-search = { path = "../sofd-search", version = "0.6", optional = true }
sofd-archive = { path = "../sofd-archive", version = "0.5", optional = true }
sofd-print = { path = "../sofd-print", version = "0.5", optional = true }
tracing.workspace = true
rayon = { version = "1.11", optional = true }
# The page tree over the pages `sofd-convert` writes, which is a document-level
# job and so lives here rather than in the crate that converts one page.
lopdf = { workspace = true, optional = true }

[dev-dependencies]
# Fixture archives, so a test opens a real document rather than hand-built XML.
sofd-testkit = { path = "../sofd-testkit" }
# The golden suite compares rendered pixels, so it decodes PNG to read them.
image.workspace = true

[features]
# `sofd-convert` reaches PDF only through `sofd-convert/pdf`, because the
# workspace names it `default-features = false`. So `pdf` belongs here: an
# absent default would leave `cargo add sofd` without PDF writing and no error.
default = ["render", "sign", "convert", "pdf"]

# Capability features, to trim binary size per delivery form.
render   = ["dep:sofd-render"]
print    = ["dep:sofd-print"]
sign     = ["dep:sofd-sign", "dep:sofd-crypto"]
# Convert pulls in the raster backend anyway (PNG output goes through it),
# so naming the dependency here costs no extra compilation.
convert  = ["dep:sofd-convert", "dep:sofd-render"]
pdf      = ["convert", "sofd-convert/pdf", "dep:lopdf"]
# No `office` or `ocr` feature here either: a forwarding name enabled nothing
# in the crate it named, so a caller asked for a capability and compiled
# without it. Enabling one now fails the build rather than lying.
edit     = ["dep:sofd-edit"]
search   = ["dep:sofd-search"]
archive  = ["dep:sofd-archive"]
# Annotations are read through the parser, which is never optional, so this
# feature only names the capability: it trims nothing at compile time.
annot    = []
async    = ["dep:rayon"]

[package.metadata.cargo-semver-checks.lints]
workspace = true

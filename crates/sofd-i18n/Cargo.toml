[package]
name = "sofd-i18n"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "sOFD localization message layer built on Fluent"
keywords = ["ofd", "i18n", "localization", "fluent"]
categories = ["localization"]

# Layer L1.5: depended on by presentation only (CLI, WASM, FFI, server, GUI).
# Engine crates never depend on this one; they return structured errors and
# data, and presentation renders the localized text.

[dependencies]
fluent.workspace = true
fluent-bundle.workspace = true
fluent-langneg.workspace = true
unic-langid.workspace = true
tracing.workspace = true
serde.workspace = true

[features]
default = ["locales-zh-cn", "locales-en-us"]
locales-zh-cn = []
locales-en-us = []
# Convenience feature: English only, for embedded or slim distributions.
english-only = ["locales-en-us"]

# The one published crate that lacked this line, so it was checked against the
# tool's defaults instead of the policy in the root manifest: a new message id
# read as a major break, when every other crate allows a variant in a minor.
# Conventions section 6 warns that omitting the line is silent, which is what
# made the omission survive until a variant was added.
[package.metadata.cargo-semver-checks.lints]
workspace = true

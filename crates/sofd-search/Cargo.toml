[package]
name = "sofd-search"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Full-text search over an OFD document, answering with page, run and rectangle"
keywords = ["ofd", "search", "full-text", "text"]
categories = ["text-processing"]

[dependencies]
sofd-common = { path = "../sofd-common", version = "0.5" }
sofd-display = { path = "../sofd-display", version = "0.5" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
tracing.workspace = true

[dev-dependencies]
sofd-font = { path = "../sofd-font", version = "0.5" }
criterion.workspace = true
sofd-package = { path = "../sofd-package", version = "0.5" }
sofd-parser = { path = "../sofd-parser", version = "0.5" }
sofd-testkit = { path = "../sofd-testkit" }

[[bench]]
name = "search"
harness = false

[package.metadata.cargo-semver-checks.lints]
workspace = true

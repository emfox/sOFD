[package]
name = "sofd-convert"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Write a display list as SVG, PDF or PNG"
keywords = ["ofd", "pdf", "svg", "png", "convert"]
categories = ["multimedia::encoding"]

# Conversion reads one display list and writes another format,
# so it depends on display plus the relevant format readers and writers.
[dependencies]
sofd-common = { path = "../sofd-common", version = "0.6" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-display = { path = "../sofd-display", version = "0.8" }
sofd-io = { path = "../sofd-io", version = "0.5" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-render = { path = "../sofd-render", version = "0.7" }
image.workspace = true
tracing.workspace = true
lopdf = { workspace = true, optional = true }

[features]
default = ["pdf"]
pdf     = ["dep:lopdf"]
# No `office` or `ocr` feature: one that compiles and does nothing reads as a
# capability this crate has. Enabling either now fails the build, which is the
# honest answer. `docs/Roadmap.md` carries the intent.

[dev-dependencies]
criterion.workspace = true
sofd-testkit = { path = "../sofd-testkit" }
# The benchmark drives this crate as a real caller: it opens a package, parses
# a page and converts it, without the facade in between. Those crates are here
# only as path entries — dev-dependencies reach nobody, so publishing needs no
# version numbers for them.
sofd-parser = { path = "../sofd-parser" }
sofd-package = { path = "../sofd-package" }

[[bench]]
name = "convert"
harness = false

[package.metadata.cargo-semver-checks.lints]
workspace = true

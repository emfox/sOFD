[package]
name = "sofd-convert"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Write a display list as SVG, PDF or PNG"
keywords = ["ofd", "pdf", "svg", "png", "convert"]
categories = ["multimedia::encoding"]

# Conversion reads one display list and writes another format,
# so it depends on display plus the relevant format readers and writers.
[dependencies]
sofd-common = { path = "../sofd-common", version = "0.5" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-display = { path = "../sofd-display", version = "0.5" }
sofd-io = { path = "../sofd-io", version = "0.5" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-render = { path = "../sofd-render", version = "0.6" }
image.workspace = true
tracing.workspace = true
lopdf = { workspace = true, optional = true }

[features]
default = ["pdf"]
pdf     = ["dep:lopdf"]
# No `office` or `ocr` feature: one that compiles and does nothing reads as a
# capability this crate has. Enabling either now fails the build, which is the
# honest answer. `docs/Roadmap.md` carries the intent.

[dev-dependencies]
criterion.workspace = true
# A range rather than `0.7` because of the order the two crates publish in.
# `sofd` depends on this crate, so `sofd-convert` has to be on the registry
# before the `sofd` that names it — and cargo resolves every requirement in a
# manifest it uploads, dev-dependencies included, so a `0.7` here asks for a
# version that by construction cannot exist yet. The range covers it either way,
# and a dev-dependency reaches nobody: it is not part of what a consumer gets.
sofd = { path = "../sofd", version = ">=0.6, <0.8" }
sofd-testkit = { path = "../sofd-testkit" }

[[bench]]
name = "convert"
harness = false

[package.metadata.cargo-semver-checks.lints]
workspace = true

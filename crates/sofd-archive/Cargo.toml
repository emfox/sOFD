[package]
name = "sofd-archive"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Audit an OFD file for archival readiness under GB/T 33190-2016 and GB/T 42133-2022"
keywords = ["ofd", "archive", "compliance", "gb-t-33190", "audit"]
categories = ["development-tools::testing"]

[dependencies]
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-package = { path = "../sofd-package", version = "0.5" }
sofd-xml = { path = "../sofd-xml", version = "0.5" }
serde.workspace = true
tracing.workspace = true

# No `xsd-validate` feature: a check against the annex A schemas would be worth
# having, but the name enabled nothing, and `docs/Roadmap.md` carries the intent.

[package.metadata.cargo-semver-checks.lints]
workspace = true

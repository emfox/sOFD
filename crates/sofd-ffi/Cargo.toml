[package]
name = "sofd-ffi"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Ships as an application, not as a dependency.
publish = false

[lib]
# The rlib is what the tests link; cdylib and staticlib are the shipping
# forms for host applications.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sofd = { path = "../sofd", version = "0.9", features = ["sign", "convert", "search", "pdf"] }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-bindings = { path = "../sofd-bindings", version = "0.2" }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
sofd-testkit = { path = "../sofd-testkit" }

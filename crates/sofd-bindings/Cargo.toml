[package]
name = "sofd-bindings"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plain data shapes shared by the language bindings"
keywords = ["ofd", "bindings", "ffi", "wasm"]
categories = ["api-bindings"]

[dependencies]
sofd = { path = "../sofd", version = "0.9", features = ["sign", "search"] }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
serde.workspace = true

[package.metadata.cargo-semver-checks.lints]
workspace = true

[dev-dependencies]
sofd-testkit = { path = "../sofd-testkit", features = ["sign"] }

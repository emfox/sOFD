[package]
name = "sofd-fuzz"
version = "0.1.0"
publish = false
edition = "2021"
description = "Fuzz targets for the OFD readers"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# cargo-fuzz needs an independent workspace, so this crate is one: the table
# below is what a fuzzed crate resolves to, and the features are what the
# targets reach for.
[workspace]

[workspace.dependencies]
sofd-common = { path = "../../sofd-common" }
sofd-convert = { path = "../../sofd-convert", features = ["pdf"] }
sofd-crypto = { path = "../../sofd-crypto" }
sofd-display = { path = "../../sofd-display" }
sofd-font = { path = "../../sofd-font", default-features = false }
sofd-geometry = { path = "../../sofd-geometry" }
sofd-package = { path = "../../sofd-package" }
sofd-parser = { path = "../../sofd-parser" }
sofd-xml = { path = "../../sofd-xml" }

[dependencies]
libfuzzer-sys = "0.4"
sofd-common.workspace = true
sofd-convert.workspace = true
sofd-crypto.workspace = true
sofd-display.workspace = true
sofd-font.workspace = true
sofd-geometry.workspace = true
sofd-package.workspace = true
sofd-parser.workspace = true
sofd-xml.workspace = true

[profile.release]
debug = 1

[[bin]]
name = "package_open"
path = "fuzz_targets/package_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_cursor"
path = "fuzz_targets/xml_cursor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ttf_face"
path = "fuzz_targets/ttf_face.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certificate"
path = "fuzz_targets/certificate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_write"
path = "fuzz_targets/pdf_write.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_chain"
path = "fuzz_targets/parser_chain.rs"
test = false
doc = false
bench = false

[package]
name = "sofd-parser"
version = "0.5.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Parse an OFD document into display lists, one flattening for every output"
keywords = ["ofd", "parser", "document", "display-list", "gb-t-33190"]
categories = ["parser-implementations"]

[dependencies]
sofd-common = { path = "../sofd-common", version = "0.6" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-model = { path = "../sofd-model", version = "0.6" }
sofd-xml = { path = "../sofd-xml", version = "0.5" }
sofd-package = { path = "../sofd-package", version = "0.6" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
sofd-display = { path = "../sofd-display", version = "0.7" }
sofd-io = { path = "../sofd-io", version = "0.5" }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
sofd-render = { path = "../sofd-render", version = "0.7" }
sofd-testkit = { path = "../sofd-testkit" }
# The memory benchmark rasterizes a page, which is where a page's bytes go.
sofd = { path = "../sofd", version = "0.8" }
sofd-convert = { path = "../sofd-convert", version = "0.9" }

[[bench]]
name = "parse"
harness = false

# The memory ceiling, measured through a counting allocator rather than timed.
[[bench]]
name = "memory"
harness = false

[package.metadata.cargo-semver-checks.lints]
workspace = true

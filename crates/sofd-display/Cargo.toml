[package]
name = "sofd-display"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "The display list that the nested OFD template tree flattens into, shared by every consumer"
keywords = ["ofd", "display-list", "rendering", "document"]
categories = ["rendering"]

# The display list is the shared IR for render, print and export.
# It depends on geometry and fonts, never on a concrete backend.
[dependencies]
sofd-common = { path = "../sofd-common", version = "0.6" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-geometry = { path = "../sofd-geometry", version = "0.5" }
sofd-font = { path = "../sofd-font", version = "0.5" }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package.metadata.cargo-semver-checks.lints]
workspace = true

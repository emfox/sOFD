[package]
name = "sofd-edit"
version = "0.5.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-pattern editing of an OFD document with an undo stack"
keywords = ["ofd", "edit", "document", "undo"]
categories = ["text-processing"]

# Editing applies undoable changes through the command pattern,
# produces a new package, and persists it through the package layer.
[dependencies]
sofd-common = { path = "../sofd-common", version = "0.6" }
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-model = { path = "../sofd-model", version = "0.6" }
sofd-package = { path = "../sofd-package", version = "0.6" }
tracing.workspace = true

[dev-dependencies]
# The round-trip test asserts on what a reader reports, not on the model the
# command touched, so it opens the archive back through the facade.
sofd = { path = "../sofd", features = ["render"], version = "0.7" }
sofd-display = { path = "../sofd-display", version = "0.7" }
# Fixture documents whose page files a test can replace.
sofd-testkit = { path = "../sofd-testkit" }

[package.metadata.cargo-semver-checks.lints]
workspace = true

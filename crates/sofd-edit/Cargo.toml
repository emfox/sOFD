[package]
name = "sofd-edit"
version = "0.5.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-pattern editing of an OFD document with an undo stack"
keywords = ["ofd", "edit", "document", "undo"]
categories = ["text-processing"]

# Editing applies undoable changes through the command pattern,
# produces a new package, and persists it through the package layer.
[dependencies]
sofd-error = { path = "../sofd-error", version = "0.5" }
sofd-model = { path = "../sofd-model", version = "0.6" }
tracing.workspace = true

[dev-dependencies]
# The command tests build their fixtures out of model values, and a rectangle
# is the only thing they name from the layer below.
sofd-common = { path = "../sofd-common", version = "0.6" }

[package.metadata.cargo-semver-checks.lints]
workspace = true

[workspace]
resolver = "3"
members = [
    # Update this list whenever a crate is added.
    # L0 foundation: pure capability, no domain semantics
    "crates/sofd-common",
    "crates/sofd-error",
    "crates/sofd-io",

    # L1 format: OFD national standard data model
    "crates/sofd-model",
    "crates/sofd-xml",
    "crates/sofd-package",

    # L1.5 i18n: depended on by presentation only, never by the engine
    "crates/sofd-i18n",

    # L1.5 artwork: the icon set as the theme's own path data, so the `egui`
    # shell and the Tauri shell draw the same glyphs instead of two copies
    "crates/sofd-icons",

    # L2 engine: parsing, geometry, rendering, fonts
    "crates/sofd-geometry",
    "crates/sofd-font",
    "crates/sofd-display",
    "crates/sofd-parser",
    "crates/sofd-render",

    # L3 capabilities: decoupled business capabilities
    "crates/sofd-sign",
    "crates/sofd-crypto",
    "crates/sofd-convert",
    "crates/sofd-edit",
    "crates/sofd-search",
    "crates/sofd-archive",
    "crates/sofd-print",

    # L4 facade
    "crates/sofd",

    # L5 adapters: one per delivery form
    "crates/sofd-cli",
    "crates/sofd-wasm",
    "crates/sofd-ffi",
    "crates/sofd-server",

    # L5 adapters: the shells, and the session state they share
    "crates/sofd-session",
    "crates/sofd-egui",

    # Testing support: fixtures shared by the suites, never released
    "crates/sofd-testkit",

    # Fuzz targets: nightly only, and the crate wraps cargo-fuzz's own one
    "crates/sofd-fuzz",
]
default-members = ["crates/sofd", "crates/sofd-cli"]

[workspace.package]
edition = "2024"
# The one place the minimum is stated; README and docs restate it. Verified by
# checking the workspace under this exact toolchain, not by trying to infer it.
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/emfox/sOFD"
readme = "README.md"
authors = ["OFD Team"]

[workspace.dependencies]
# Internal crates are no longer listed here. Each crate states the version
# interval it needs, beside the dependency itself, because that is the number a
# registry resolves and the number a release has to move. A single entry here
# could only restate one version for all of them, which is the scheme
# `docs/Versioning.md` replaces.
#
# A dev-dependency is the exception: declared path-only, so cargo drops it from
# the manifest it packs. The aliases are below, for that reason alone.

# External dependencies: versions pinned in one place
zip        = { version = "9", default-features = false, features = ["deflate", "deflate64", "time"] }
quick-xml  = { version = "0.42", features = ["serialize"] }
serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"
tracing    = "0.1"
# eframe's browser logger writes through `log`, which the reader uses on wasm.
log        = "0.4"
bitflags   = "2"
uuid       = { version = "1", features = ["v4", "serde"] }

# Internationalization (Fluent)
fluent      = "0.16"
fluent-bundle = "0.15"
fluent-langneg = "0.13"
unic-langid = { version = "0.9", features = ["macros"] }
icu_datetime = { version = "2", default-features = false, features = ["compiled_data"] }
icu_decimal  = { version = "2", default-features = false, features = ["compiled_data"] }

# Graphics and rendering
tiny-skia  = "0.11"
skrifa     = "0.48"
fontdue    = "0.9"
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif"] }

# JBIG2 for scanned pages. The `simd` feature is off on purpose: it pulls in
# fearless_simd, and every backend here is `#![forbid(unsafe_code)]`.
hayro-jbig2 = { version = "0.3", default-features = false }

# PDF interop
pdf        = { version = "0.10", default-features = false }
lopdf      = { version = "0.45", default-features = false }

# Chinese national cryptography
cipher     = "0.5"
ecb        = "0.2"
cbc        = "0.2"
sm2        = { version = "0.14", features = ["arithmetic", "dsa", "pem", "getrandom"] }
signature  = "3"
getrandom  = "0.3"
sm3        = "0.5"
sm4        = "0.6"
x509-parser = "0.18"
der        = { version = "0.8", features = ["alloc", "oid"] }

# Concurrency and runtime, behind the server feature
tokio      = { version = "1", features = ["full"] }
rayon      = "1.11"
axum       = "0.8"

# Desktop GUI for the native reader. Pinned below 0.36, which needs Rust 1.95.
egui = "0.35"
eframe = { version = "0.35", default-features = false }

# Platform integration
wasm-bindgen       = "0.2"
wasm-bindgen-futures = "0.4"
js-sys             = "0.3"
web-sys            = "0.3"

# Development and testing
proptest   = "1"
criterion  = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"

# The semver policy lives here and is read only by a crate that opts in with
# `[package.metadata.cargo-semver-checks.lints] workspace = true`, because the
# tool has no file of its own and no default opt-in. A field added to a public
# struct breaks a literal a caller wrote, so it costs a minor release like a
# new enum variant; everything else still needs a major one.
#
# A variant that moves because another was inserted above it costs a minor too.
# The lint exists for a caller who cast a variant to an integer, which needs a
# `#[repr]` on the enum to be well defined and needs the number to mean
# something; no enum here states a repr, and the workspace's FFI boundary is
# where an integer is the interface, so the number is not part of a contract.
# Left at the tool's default, inserting a message id in the middle of the
# catalogue would spend a major version, which is the opposite of what
# `enum_variant_added` above decided about the same edit.
[workspace.metadata.cargo-semver-checks.lints]
enum_variant_added = { required-update = "minor" }
constructible_struct_adds_field = { required-update = "minor" }
enum_no_repr_variant_discriminant_changed = { required-update = "minor" }

# A release tag is a plain version (`v0.6.0`) and names the products, not any
# one crate: the 21 crates here no longer agree on a version, and an artefact
# named for `sofd-next` would tell a user nothing. `scripts/release_plan.py
# --tag 0.6.0` prints the tag, which is the only place the spelling lives.

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = true
